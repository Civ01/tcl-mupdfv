; tcl-mupdfv settings. Keep this file next to tcl-mupdfv.wlx / tcl-mupdfv.wlx64.
; Changes apply to the next file opened.

[General]
; 1: open files at the zoom you last used (Ctrl+wheel), for all files.
; 0: always open fitted so that one whole page is visible.
remember_zoom=0

; Last zoom in percent (100 = actual size), 0 = fit page.
; Written by the plugin when remember_zoom=1.
zoom=0
